name: Refresh Fuel Finder Data

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: refresh-fuel-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to run now
        id: schedule_gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(TZ=Europe/Dublin date +%H)" = "08" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Fuel Finder secrets
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}
        run: |
          if [ -z "$FUEL_FINDER_CLIENT_ID" ] || [ -z "$FUEL_FINDER_CLIENT_SECRET" ]; then
            echo "Missing FUEL_FINDER_CLIENT_ID or FUEL_FINDER_CLIENT_SECRET GitHub Actions secret."
            exit 1
          fi

      - name: Install dependencies
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: npm ci

      - name: Refresh and commit repo snapshots
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}
          FUEL_FINDER_ENVIRONMENT: production
          PUSH_CHANGES: "1"
        run: sh ./scripts/update-fuel-snapshots.sh
